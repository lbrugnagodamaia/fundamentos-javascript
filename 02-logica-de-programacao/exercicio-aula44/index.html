<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMC: Cálculo de Índice de Massa Muscular</title>
    <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body>

    <section class="container">
        <h2>Tabela IMC</h2>
        <div class="descricao">
            <article>
                <h3>IMC</h3>
                <p>Menos do que 18,5</p>
                <p>Entre 18,5 e 24,9</p>
                <p>Entre 25 e 29,9</p>
                <p>Entre 30 e 34,9</p>
                <p>Entre 35 e 39,9</p>
                <p>Mais do que 40</p>
            </article>
            <article>
                <h3>Resultado</h3>
                <p>Abaixo do peso</p>
                <p>Peso normal</p>
                <p>Sobrepeso</p>
                <p>Obesidade grau 1</p>
                <p>Obesidade grau 2</p>
                <p>Obesidade grau 3</p>
            </article>

        </div>
        <h2>Calcule seu IMC</h2>

        <form action="">
            <label for="input-peso">Peso:</label>
            <input type="number" id="input-peso">

            <label for="input-altura">Altura:</label>
            <input type="text" id="input-altura">

            <button>Enviar</button>
        </form>
    </section>

    <script src="./assets/js/main.js"></script>
</body>

</html>
